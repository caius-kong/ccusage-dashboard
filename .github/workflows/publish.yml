name: Publish to npm

# Manual release (recommended):
#   Actions tab → "Publish to npm" → Run workflow.
#
#   - Leave "Version" empty → bumps a patch (e.g. 0.2.0 → 0.2.1)
#   - Or type a semver (no "v" prefix), e.g. "1.2.3" → releases exactly that
#
# The workflow bumps package.json, commits, tags vX.Y.Z, pushes back to main,
# and publishes to npm — everything happens here in CI, with a full audit log.
# Nothing to run locally; no local clean-tree requirement.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version to publish (semver, no "v" prefix). Empty = bump patch automatically.'
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit the version bump + push the tag
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for npm version to see the previous tag

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Configure git bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Bump version: explicit input wins, else auto patch.
      - name: Bump version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            npm version "${{ inputs.version }}" -m "chore: release v%s"
          else
            npm version patch -m "chore: release v%s"
          fi
          echo "Releasing $(node -p "require('./package.json').version")"

      - name: Push bump + tag back to main
        run: git push --follow-tags origin main

      - name: Install deps
        run: npm install --package-lock-only --ignore-scripts

      - name: Publish to npm
        run: npm publish --access=public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
